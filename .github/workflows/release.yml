name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  RELEASE_VERSION: 1.0.0

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pokecom-go-studio-windows
          - os: ubuntu-latest
            artifact: pokecom-go-studio-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v${RELEASE_VERSION}"

      - name: Set up Java with jpackage
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Test and package Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :core:desktopTest :hostInput:desktopTest :desktopApp:test :desktopApp:verifyDistributionRuntime :desktopApp:packageMsi --no-daemon

      - name: Verify Windows MSI identity and version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          ./scripts/inspect-msi.ps1 -Path $msi.FullName -VerifyCurrent

      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "release-assets/PokecomGOStudio-$env:RELEASE_VERSION-windows-x64.msi"
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/PokecomGOStudio -DestinationPath "release-assets/PokecomGOStudio-$env:RELEASE_VERSION-windows-x64.zip"
          Get-ChildItem release-assets -File |
            Where-Object Name -NotLike 'SHA256SUMS-*' |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii release-assets/SHA256SUMS-windows.txt

      - name: Test and package Linux
        if: runner.os == 'Linux'
        run: ./gradlew :core:desktopTest :hostInput:desktopTest :desktopApp:test :desktopApp:verifyDistributionRuntime :desktopApp:packageDeb --no-daemon

      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          cp desktopApp/build/compose/binaries/main/deb/*.deb \
            "release-assets/PokecomGOStudio-${RELEASE_VERSION}-linux-amd64.deb"
          tar -C desktopApp/build/compose/binaries/main/app -czf \
            "release-assets/PokecomGOStudio-${RELEASE_VERSION}-linux-amd64.tar.gz" \
            PokecomGOStudio
          cd release-assets
          sha256sum ./* > SHA256SUMS-linux.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  macos-signing:
    name: Sign and notarize macOS (approval required)
    runs-on: macos-latest
    timeout-minutes: 60
    environment: macos-signing
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${RELEASE_VERSION}"

      - name: Set up Java with jpackage
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test notarization acceptance gates
        run: python3 -m unittest discover -s scripts/tests -p test_notarize_macos.py

      - name: Configure macOS signing keychain
        shell: bash
        env:
          PGP_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          PGP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PGP_MAC_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          PGP_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          PGP_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          PGP_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -eu
          for name in PGP_CERTIFICATE_BASE64 PGP_CERTIFICATE_PASSWORD PGP_MAC_SIGNING_IDENTITY PGP_NOTARY_APPLE_ID PGP_NOTARY_TEAM_ID PGP_NOTARY_PASSWORD; do
            test -n "${!name}" || { echo "Missing macOS signing secret: $name"; exit 1; }
          done
          keychain="$RUNNER_TEMP/pgp-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          export PGP_CERTIFICATE_FILE="$RUNNER_TEMP/pgp-signing.p12"
          python3 -c 'import base64, os; from pathlib import Path; p=Path(os.environ["PGP_CERTIFICATE_FILE"]); p.write_bytes(base64.b64decode(os.environ["PGP_CERTIFICATE_BASE64"], validate=True)); p.chmod(0o600)'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$PGP_CERTIFICATE_FILE" -P "$PGP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials pgp-notary --apple-id "$PGP_NOTARY_APPLE_ID" --team-id "$PGP_NOTARY_TEAM_ID" --password "$PGP_NOTARY_PASSWORD" --keychain "$keychain"
          echo "PGP_MAC_SIGNING_IDENTITY=$PGP_MAC_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "PGP_MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$PGP_CERTIFICATE_FILE"

      - name: Test and sign macOS app
        run: ./gradlew :core:desktopTest :hostInput:desktopTest :desktopApp:test :desktopApp:verifyDistributionRuntime --no-daemon

      - name: Notarize macOS app
        run: python3 scripts/notarize-macos.py desktopApp/build/compose/binaries/main/app/PokecomGOStudio.app --keychain "$PGP_MAC_SIGNING_KEYCHAIN"

      - name: Package signed macOS DMG
        # The app was already signed, runtime-verified and stapled. Do not regenerate it.
        run: ./gradlew :desktopApp:packageDmg -x :desktopApp:createDistributable --no-daemon

      - name: Notarize macOS DMG
        run: python3 scripts/notarize-macos.py desktopApp/build/compose/binaries/main/dmg/PokecomGOStudio-1.6.0.dmg --keychain "$PGP_MAC_SIGNING_KEYCHAIN"

      - name: Collect macOS packages
        shell: bash
        run: |
          mkdir -p release-assets
          mac_arch=$(uname -m)
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg \
            "release-assets/PokecomGOStudio-${RELEASE_VERSION}-macos-${mac_arch}.dmg"
          ditto -c -k --keepParent \
            desktopApp/build/compose/binaries/main/app/PokecomGOStudio.app \
            "release-assets/PokecomGOStudio-${RELEASE_VERSION}-macos-${mac_arch}.zip"
          cd release-assets
          shasum -a 256 ./* > SHA256SUMS-macos.txt

      - name: Upload signed macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: pokecom-go-studio-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Clean up macOS signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/pgp-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/pgp-signing.p12"

  android-player:
    name: Package (Android Player)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v${RELEASE_VERSION}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Player APK
        run: ./gradlew :hostInput:testDebugUnitTest :playerShared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --no-daemon

      - name: Collect Android Player package
        shell: bash
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "release-assets/PokecomGOPlayer-${RELEASE_VERSION}-android-debug.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS-android.txt

      - name: Upload Player package
        uses: actions/upload-artifact@v4
        with:
          name: pokecom-go-player-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Prepare draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, macos-signing, android-player]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Studio release packages
        uses: actions/download-artifact@v4
        with:
          # Android debug APK remains a workflow artifact, not a release asset.
          pattern: pokecom-go-studio-*
          path: release-assets
          merge-multiple: true

      # Signed macOS assets are included only after approval and notarization succeed.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --draft \
            --title "Pokecom GO Studio 1.0.0" \
            --notes-file docs/releases/notes/RELEASE_NOTES_1.0.0.md
