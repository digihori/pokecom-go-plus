name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test iOS change detection
        run: python3 -m unittest discover -s scripts/tests -p test_ci_ios_changes.py
      - name: Detect changed iOS inputs
        id: filter
        run: python3 scripts/ci-ios-changes.py

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./gradlew :core:desktopTest :hostInput:desktopTest :desktopApp:build :desktopApp:verifyDistributionRuntime --no-daemon

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :core:desktopTest :hostInput:desktopTest :desktopApp:build :desktopApp:verifyDistributionRuntime --no-daemon

      - name: Upload debugger acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debugger-acceptance-${{ matrix.os }}
          path: |
            desktopApp/build/reports/debugger-release/*.png
            desktopApp/build/test-results/test/*.xml
            core/build/test-results/desktopTest/*.xml
          retention-days: 14
          if-no-files-found: warn

  android-player:
    name: Build and test (Android Player)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Player APK
        run: ./gradlew :hostInput:testDebugUnitTest :playerShared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --no-daemon

  ios-player:
    name: Build and test (iOS unit tests)
    needs: changes
    # Keep the check name present; a skipped job succeeds instead of leaving
    # workflow-level path-filtered required checks pending. Detection failure
    # must run iOS, while cancellation must not start another expensive job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-local
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PGP_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Swift tests already passed when the 20-minute job timed out in
          # cleanup, which launched the runner's unrelated system Gradle.
          cache-cleanup: never

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-xcode26.6-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build app and run Swift unit tests
        run: sh iosApp/test-simulator.sh --unit

      - name: Upload iOS unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results
          path: |
            iosApp/build/CI-TestResults*.xcresult
            iosApp/build/CI-SimulatorBoot.log
            core/build/test-results/iosSimulatorArm64Test/**
            hostInput/build/test-results/iosSimulatorArm64Test/**
            playerShared/build/test-results/iosSimulatorArm64Test/**
          if-no-files-found: warn
          retention-days: 14
