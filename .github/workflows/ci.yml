name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./gradlew :core:desktopTest :hostInput:desktopTest :desktopApp:build --no-daemon

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :core:desktopTest :hostInput:desktopTest :desktopApp:build --no-daemon

  android-player:
    name: Build and test (Android Player)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Player APK
        run: ./gradlew :hostInput:testDebugUnitTest :playerShared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --no-daemon

  ios-player:
    name: Build and test (iPhone Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-local
      # Pin the SDK and UI runtime together instead of using the image default/first device.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PGP_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test shared Native code and link frameworks
        run: ./gradlew --gradle-user-home .gradle-local :core:iosSimulatorArm64Test :hostInput:iosSimulatorArm64Test :playerShared:iosSimulatorArm64Test :playerShared:linkDebugFrameworkIosSimulatorArm64 :playerShared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Build and test unsigned iPhone Simulator app
        run: sh iosApp/test-simulator.sh

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          path: |
            iosApp/build/CI-TestResults*.xcresult
            iosApp/build/CI-FileProvider.log
            core/build/test-results/iosSimulatorArm64Test/**
            hostInput/build/test-results/iosSimulatorArm64Test/**
            playerShared/build/test-results/iosSimulatorArm64Test/**
          if-no-files-found: warn
          retention-days: 14
