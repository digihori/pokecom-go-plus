mcp.heading=Read-only localhost MCP server
mcp.scope=Exposes pgp_get_capabilities, pgp_get_debug_context, and pgp_get_debug_registrations. It never pauses, runs, writes memory, changes source, or reads arbitrary files.
mcp.how=How it works
mcp.howHelp=1. Start server creates a new temporary bearer token.\n2. Studio writes an Authorization header to an owner-only file outside the project.\n3. Codex runs the configured http_headers_helper for each connection and reads the current header.\n4. Studio accepts authenticated requests only from this computer through 127.0.0.1.\n5. Stop server or quitting Studio invalidates the token and removes its credential file.
