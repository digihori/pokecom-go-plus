mcp.howHelp=1. サーバーを起動すると新しい一時Bearerトークンを生成します。\n2. Studioはプロジェクト外に、所有者だけがアクセスできるAuthorizationヘッダーファイルを保存します。\n3. Codexは接続ごとに設定済みのhttp_headers_helperを実行し、現在のヘッダーを読み込みます。\n4. Studioは127.0.0.1経由で、このコンピューターからの認証済みリクエストだけを受け付けます。\n5. サーバーを停止するかStudioを終了すると、トークンを無効化し、認証ファイルを削除します。
