mcp.heading=localhost MCPサーバー
mcp.scope=開発・デバッグ情報と登録ソースを取得します。差分・Build・デバッグ操作・Load・ContinueはStudio承認付きです。Step／ContinueはRAMやI/Oを変える場合があります。任意パス・直接メモリ書込み・PCの強制移動は提供しません。
